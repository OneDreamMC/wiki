name: Signaler une erreur
description: Une information fausse, obsolète ou incomplète dans une page du wiki.
labels: [erreur]
body:
  - type: input
    id: page
    attributes:
      label: Page concernée
      description: L'adresse de la page sur le site.
      placeholder: https://one-dream.fr/wiki/iles/livraison
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui ne va pas
      description: Citez le passage concerné et expliquez ce qui est faux.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: La bonne information
      description: Si vous la connaissez. Comment l'avez-vous vérifiée ?
